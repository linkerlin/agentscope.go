<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentScope Go · Console</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo">◆</span>
        <span class="brand-name">AgentScope<span class="dim">.go</span></span>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="chat">
          <span class="nav-ico">💬</span> Chat
        </button>
        <button class="nav-item" data-view="kb">
          <span class="nav-ico">📚</span> Knowledge Bases
        </button>
        <button class="nav-item" data-view="system">
          <span class="nav-ico">⚙</span> System
        </button>
        <button class="nav-item" data-view="cp">
          <span class="nav-ico">◈</span> Control Plane
        </button>
      </nav>
      <div class="sidebar-footer">
        <div class="session-box">
          <span class="label">Session</span>
          <code id="session-id"></code>
        </div>
        <span id="reconnect-status" class="reconnect-status" aria-live="polite"></span>
      </div>
    </aside>

    <main class="main">
      <!-- Chat view -->
      <section id="view-chat" class="view active">
        <div id="messages" class="messages" aria-live="polite"></div>
        <footer class="composer">
          <form id="chat-form">
            <textarea id="input" rows="2" placeholder="输入消息… (demo 模式可试 tool / offload)" autofocus></textarea>
            <button type="submit" id="send-btn">发送</button>
          </form>
        </footer>
      </section>

      <!-- Knowledge Bases view -->
      <section id="view-kb" class="view">
        <header class="view-head">
          <h2>Knowledge Bases</h2>
          <button class="btn primary" id="kb-new-btn">+ 新建</button>
        </header>
        <div id="kb-list" class="kb-grid"></div>

        <div id="kb-detail" class="kb-detail hidden">
          <button class="btn ghost" id="kb-back-btn">← 返回列表</button>
          <div class="kb-detail-head">
            <div>
              <h3 id="kb-detail-name"></h3>
              <p id="kb-detail-desc" class="dim"></p>
            </div>
          </div>
          <div class="kb-actions">
            <label class="btn primary file-btn">
              上传文档
              <input type="file" id="kb-upload-input" multiple hidden />
            </label>
            <input type="text" id="kb-search-input" class="text-input" placeholder="搜索知识库…" />
            <button class="btn" id="kb-search-btn">检索</button>
          </div>
          <div id="kb-search-results" class="kb-results"></div>
          <h4 class="mt">已索引文档</h4>
          <div id="kb-doc-list" class="doc-list"></div>
        </div>
      </section>

      <!-- System view -->
      <section id="view-system" class="view">
        <header class="view-head"><h2>System</h2></header>
        <div class="cards">
          <div class="card">
            <h3>Health</h3>
            <pre id="sys-health" class="mono">检查中…</pre>
          </div>
          <div class="card">
            <h3>Models</h3>
            <div id="sys-models" class="mono">加载中…</div>
          </div>
        </div>
      </section>

      <!-- Control Plane view (long-running agent governance, LoopX-style) -->
      <section id="view-cp" class="view">
        <!-- Goal list -->
        <header class="view-head" id="cp-list-head">
          <h2>Control Plane · Lifetime Goals</h2>
          <button class="btn primary" id="cp-new-btn">+ New Goal</button>
        </header>
        <div id="cp-goal-list" class="goal-grid"></div>

        <h4 class="mt">能力目录（Capability Catalog）</h4>
        <div id="cp-capabilities" class="cap-grid"></div>

        <!-- Goal detail -->
        <div id="cp-detail" class="cp-detail hidden">
          <button class="btn ghost" id="cp-back-btn">← 返回目标列表</button>
          <div class="cp-detail-head">
            <div>
              <h3 id="cp-obj"></h3>
              <p id="cp-meta" class="dim"></p>
            </div>
            <div id="cp-actions" class="cp-actions"></div>
          </div>

          <div class="cards">
            <div class="card">
              <h3>ShouldRun 决策</h3>
              <div id="cp-decision" class="mono">点击「检查」查询…</div>
              <button class="btn" id="cp-check-btn" style="margin-top:8px">检查 ShouldRun</button>
            </div>
            <div class="card">
              <h3>配额（滚动窗口）</h3>
              <div id="cp-quota" class="mono">—</div>
              <div class="quota-bar"><div id="cp-quota-fill" class="quota-fill"></div></div>
            </div>
          </div>

          <h4 class="mt">开放 Todos</h4>
          <div id="cp-todos" class="doc-list"></div>

          <h4 class="mt">待决 User Gates</h4>
          <div id="cp-gates" class="gate-list"></div>

          <h4 class="mt">决策谱系（近 20 条）</h4>
          <div id="cp-lineage" class="lineage"></div>

          <h4 class="mt">看板（Kanban 投影 + row lineage）
            <button class="btn" id="cp-kanban-btn" style="margin-left:8px">刷新看板</button>
          </h4>
          <div id="cp-kanban" class="kanban-board"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- KB create modal -->
  <div id="kb-modal" class="modal hidden">
    <div class="modal-card">
      <h3>新建知识库</h3>
      <label>Name<input type="text" id="kb-form-name" class="text-input" /></label>
      <label>Description<input type="text" id="kb-form-desc" class="text-input" /></label>
      <input type="hidden" id="kb-form-embedder" value="stub" />
      <div class="modal-actions">
        <button class="btn ghost" id="kb-modal-cancel">取消</button>
        <button class="btn primary" id="kb-modal-create">创建</button>
      </div>
    </div>
  </div>

  <!-- Control Plane: new goal modal -->
  <div id="cp-modal" class="modal hidden">
    <div class="modal-card">
      <h3>新建生命周期目标</h3>
      <label>Objective<input type="text" id="cp-form-obj" class="text-input" placeholder="例如：安全交付 feature X" /></label>
      <label>Scope（逗号分隔的非目标/边界，可选）<input type="text" id="cp-form-scope" class="text-input" placeholder="no direct push to main" /></label>
      <div class="modal-actions">
        <button class="btn ghost" id="cp-modal-cancel">取消</button>
        <button class="btn primary" id="cp-modal-create">创建</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
