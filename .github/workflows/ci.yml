name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ["1.25"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Format Check
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Test
        run: make test
        timeout-minutes: 15

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2
          args: --timeout 5m

  release-consistency:
    name: Release Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # release mode verifies the tag exists locally.
          fetch-depth: 0

      # On a v* tag push, the tag must match the declared version; on
      # branches/PRs only version.go ↔ CHANGELOG ↔ release notes ↔ README
      # are checked (the next tag may not exist yet).
      - name: Check release consistency
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/check_release.sh --tag "${GITHUB_REF#refs/tags/}"

      - name: Check version declarations
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: scripts/check_release.sh

  docs-consistency:
    name: Docs Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # docs/ ↔ docs-site/ mirror sync + every pkg.NewXxx( referenced in a
      # docs Go snippet must exist in code (23.5).
      - name: Check docs consistency
        run: scripts/check_docs.sh

      # The documentation snippets compile and the A2A round trip executes.
      - name: Compile and run doc snippets
        run: go test ./docs/snippets/ -race -count=1
