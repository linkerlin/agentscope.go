name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ["1.26"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Format Check
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Test
        run: make test
        timeout-minutes: 15

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Three-part version required by the action ("v2" alone fails to
          # parse and the job errors before linting).
          version: v2.13.2
          args: --timeout 5m

  release-consistency:
    name: Release Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # release mode verifies the tag exists locally.
          fetch-depth: 0

      # On a v* tag push, the tag must match the declared version; on
      # branches/PRs only version.go ↔ CHANGELOG ↔ release notes ↔ README
      # are checked (the next tag may not exist yet).
      - name: Check release consistency
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/check_release.sh --tag "${GITHUB_REF#refs/tags/}"

      - name: Check version declarations
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: scripts/check_release.sh

  docs-consistency:
    name: Docs Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # docs/ ↔ docs-site/ mirror sync + every pkg.NewXxx( referenced in a
      # docs Go snippet must exist in code (23.5).
      - name: Check docs consistency
        run: scripts/check_docs.sh

      # The documentation snippets compile and the A2A round trip executes.
      - name: Compile and run doc snippets
        run: go test ./docs/snippets/ -race -count=1

  quality-gates:
    name: Coverage & Examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # Examples must be indexed, link-clean and time-limited compilable (23.6).
      - name: Check examples
        run: scripts/check_examples.sh

      # Full-suite atomic coverage against the committed baseline: total and
      # key packages must not regress (23.6).
      - name: Coverage gate
        run: scripts/check_coverage.sh
        timeout-minutes: 20

  api-compat:
    name: Exported API Compat
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The diff needs the release tags and, on PRs, the merge base.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # Prove the gate itself works before trusting it.
      - name: Gate selftest
        run: scripts/check_api_diff.sh --selftest

      # PRs diff against the target branch tip; pushes against the most
      # recent v* tag (23.7: breaking exported-API changes need an explicit
      # allowlist entry + migration note).
      - name: Exported API diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/check_api_diff.sh "origin/${{ github.base_ref }}"
          else
            scripts/check_api_diff.sh
          fi
